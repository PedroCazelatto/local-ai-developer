services:
  sandbox:
    image: debian:stable-slim
    container_name: ai_sandbox
    network_mode: none
    volumes:
      - ./projects:/workspace
    working_dir: /workspace
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4gb
    stdin_open: true
    tty: true
    command: /bin/bash
